<div id="spa-loading-template" role="status" aria-live="polite" aria-label="Loading application">
  <style>
    #spa-loading-template { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: #000; color: #f5f5f5; transition: opacity .18s ease; }
    #spa-loading-template .spa-loader { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spa-loading-spin .75s linear infinite; }
    #spa-loading-template .spa-loading-text { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes spa-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #spa-loading-template .spa-loader { animation: none; } }
  </style>
  <div class="spa-loader" aria-hidden="true"></div>
  <span class="spa-loading-text">Loading application</span>
</div>
